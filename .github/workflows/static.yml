# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm install --global yarn
          yarn
      - name: Build
        run: npm run build
        env:
          VITE_KEY: 68adsqf-poac-154s-adqkc-05s8q2c5a65s
          MOCK: true
      # Frontend coverage from the e2e tests, published at /coverage/.
      # A failure here must not block the demo deployment; the e2e tests
      # themselves are gated by the Node.js CI workflow.
      - name: Install Chromium for e2e coverage
        run: ./node_modules/.bin/playwright install chromium
      - name: Measure e2e coverage
        id: coverage
        continue-on-error: true
        run: yarn e2e:coverage
      - name: Add coverage report to the site
        if: steps.coverage.outcome == 'success'
        run: |
          rm -rf coverage-e2e/raw
          cp -r coverage-e2e dist/coverage
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist repository
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
