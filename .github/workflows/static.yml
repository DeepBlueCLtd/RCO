# Publishes the demo of main, and its frontend coverage report, to the
# gh-pages branch (served by GitHub Pages). See docs/gh-pages.md.
#   /          landing page (pages/index.html) with the PR preview list
#   /demo/     the app, with its backend running in the browser
#   /coverage/ e2e coverage of the frontend
name: Publish demo to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Build the demo
        run: |
          yarn build:demo
          mkdir -p site
          cp -r dist site/demo
      # A failure here must not block the demo; the e2e tests themselves
      # are gated by the Node.js CI workflow.
      - name: Install Chromium for e2e coverage
        run: ./node_modules/.bin/playwright install chromium
      - name: Measure e2e coverage
        id: coverage
        continue-on-error: true
        run: yarn e2e:coverage
      - name: Add coverage report to the site
        if: steps.coverage.outcome == 'success'
        run: |
          rm -rf coverage-e2e/raw
          cp -r coverage-e2e site/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Publish to gh-pages
        # coverage/ is kept as it was if this run could not measure it
        run: node scripts/gh-pages/publish.cjs --copy site/demo:demo --copy site/coverage:coverage
