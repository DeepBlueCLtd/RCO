# Publishes a preview of each pull request to the gh-pages branch, at
# /pr/<number>/ (with its e2e coverage at /pr/<number>/coverage/), lists it
# on the landing page and links it from a comment on the pull request.
# Previews are kept when the pull request closes. See docs/gh-pages.md.
#
# Pull requests from forks are skipped: their token cannot write to the
# repository.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'
      # Install scripts run only for the packages that need them (native
      # modules and esbuild's binary), not for every dependency.
      - name: Install dependencies
        run: |
          yarn --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3 bcrypt esbuild
      - name: Build the demo
        run: |
          yarn build:demo
          cp -r dist preview
      - name: Install Chromium for e2e coverage
        run: ./node_modules/.bin/playwright install chromium
      - name: Measure e2e coverage
        id: coverage
        continue-on-error: true
        run: yarn e2e:coverage
      - name: Add coverage report to the preview
        if: steps.coverage.outcome == 'success'
        run: |
          rm -rf coverage-e2e/raw
          cp -r coverage-e2e preview/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: preview
          path: preview
      - name: Publish to gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_STATE: open
        run: |
          if [ -d preview/coverage ]; then export PR_COVERAGE=true; fi
          node scripts/gh-pages/publish.cjs --copy "preview:pr/$PR_NUMBER" --pr
      - name: Comment with the preview link
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const number = context.payload.pull_request.number
            let site = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/`
            try {
              const { data } = await github.rest.repos.getPages(context.repo)
              if (data.html_url) site = data.html_url.replace(/\/?$/, '/')
            } catch (e) {
              core.info(`Pages settings not readable, using ${site}`)
            }
            const marker = '<!-- pr-preview -->'
            const sha = context.payload.pull_request.head.sha.slice(0, 7)
            const coverage = fs.existsSync('preview/coverage')
              ? `[Coverage report](${site}pr/${number}/coverage/)`
              : 'Coverage report: not available for this build'
            const body = [
              marker,
              `**Preview of this pull request** (${sha}): ${site}pr/${number}/`,
              '',
              'Runs in your browser on a copy of the development data, reset on reload. ' +
                'Sign in as `demo` with password `Demo-Vault-2468!` ' +
                `(other accounts are listed on the [site](${site}#demo)).`,
              '',
              `${coverage} · [All previews](${site}#previews)`,
              '',
              '_The preview updates on each push and is kept after this pull request closes._'
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: number,
              per_page: 100
            })
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body
              })
            }

  # Record the final state on the landing page; the preview itself stays.
  closed:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Update the preview list
        if: hashFiles('scripts/gh-pages/publish.cjs') != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_STATE: ${{ github.event.pull_request.merged && 'merged' || 'closed' }}
        run: node scripts/gh-pages/publish.cjs --pr
